name: my-first-workflow
#to get trigger on every push is this repo in my branch 
on:
  push: 
jobs:
  job1 :
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step-2 - checkout
        uses: actions/checkout@v6.0.2
      - name: step-3
        run: |
          echo pwd >>  myartifact.txt
          mkdir artifacts
          ls -ltr >> artifacts/list.txt
          hostname >> artifacts/hostname.txt
      - name: Upload Single file
        uses: actions/upload-artifact@v4
        with:
          name: single_file
          path: ./myartifact.txt
  
      - name: Upload from directory
        uses: actions/upload-artifact@v4
        with:
          name: directory-artifacts
          path: artifacts/
      - name: Upload from multiple paths
        uses: actions/upload-artifact@v4
        with:
          name: multiple_path
          path: | 
           ./myartifact.txt
           artifacts/
      - name: Upload from multiple paths with exclusion
        uses: actions/upload-artifact@v4
        with:
         name: multiple_path_exclusions
         path: | 
          ./myartifact.txt
          artifacts/
          !**/hostname.txt
  job2 :
   name: JOB2
   needs: job1
   runs-on: ubuntu-latest
   steps:
    - name: checking current directory
      run: |
        pwd
        ls -ltr
    - name: Download single file srtifact
      uses: actions/download-artifact@v5.0.0
      with:
        name: single_file
    - name: checking current directory post d
      run: |
        pwd
        ls -ltr
  job3 :
   name: JOB3
   needs: job1
   runs-on: ubuntu-latest
   steps:
    - name: checking current directory
      run: |
        pwd
        ls -ltr
    - name: Download Directory
      uses: actions/download-artifact@v5.0.0
      with:
        name: directory-artifacts
    - name: checking current directory post download
      run: |
        pwd
        ls -ltr
        
